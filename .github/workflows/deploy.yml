name: Publish web and update KVM2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: evoque-web-production
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem do client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/arthur-queiroz/evoque-billing-web:main
            ghcr.io/arthur-queiroz/evoque-billing-web:${{ github.sha }}

      - name: Permitir pull público da imagem
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH /user/packages/container/evoque-billing-web -f visibility=public

      - name: Carregar chave de deploy
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.KVM2_DEPLOY_SSH_PRIVATE_KEY }}

      - name: Instalar Cloudflare Access CLI
        run: |
          set -eu
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          sudo install -m 0755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared

      - name: Configurar SSH para KVM2
        env:
          DEPLOY_HOST: ${{ vars.KVM2_DEPLOY_HOST }}
          ACCESS_HOST: ${{ vars.KVM2_CLOUDFLARE_SSH_HOST }}
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$ACCESS_HOST"
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host kvm2-evoque
            HostName $DEPLOY_HOST
            User root
            ProxyCommand cloudflared access ssh --hostname $ACCESS_HOST
            StrictHostKeyChecking accept-new
          EOF

      - name: Atualizar somente o client na VPS
        run: |
          set -eu
          ssh kvm2-evoque '
            set -eu
            if [ ! -f /opt/evoque/current/infra/docker-compose.production.yml ]; then
              echo "Runtime ainda não instalado. A imagem web foi publicada e será usada pelo primeiro deploy da API."
              exit 0
            fi
            test -f /opt/evoque/production.env
            cd /opt/evoque/current
            docker compose --env-file /opt/evoque/production.env -f infra/docker-compose.production.yml pull web
            docker compose --env-file /opt/evoque/production.env -f infra/docker-compose.production.yml up -d web
            docker compose --env-file /opt/evoque/production.env -f infra/docker-compose.production.yml ps web
          '
