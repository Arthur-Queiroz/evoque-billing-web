name: Build, publish web, and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  release:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    uses: Arthur-Queiroz/vps-deploy/.github/workflows/app-deploy.yml@main
    with:
      app-id: evoque
      service: web
      image-repo: arthur-queiroz/evoque-billing-web
      dockerfile: docker/Dockerfile
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
